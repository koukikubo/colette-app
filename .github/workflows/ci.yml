name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *" # 毎日06:00 JST
  pull_request:
  push:
    branches: [main]

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit check --update

  lint:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    env:
      RUBOCOP_CACHE_ROOT: ${{ github.workspace }}/backend/tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('backend/.ruby-version', 'backend/.rubocop.yml', 'backend/.rubocop_todo.yml', 'backend/Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/backend_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 開発環境と同じ、gosu更新済みPostgreSQLイメージを使う。
      - name: Build PostgreSQL runtime image
        working-directory: .
        run: docker compose build --pull db

      # CI専用DBを起動する。開発環境のボリュームは使用しない。
      - name: Start test database
        run: |
          docker run -d \
            --name colette-ci-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=backend_test \
            -p 127.0.0.1:5432:5432 \
            colette-postgres:17.11-gosu1.20

      # 初期化中の一時サーバーと区別するため、TCP接続で起動を確認する。
      - name: Wait for test database
        run: |
          for attempt in $(seq 1 30); do
            if docker exec colette-ci-postgres \
              pg_isready -h 127.0.0.1 -U postgres -d backend_test; then
              exit 0
            fi
            sleep 2
          done

          docker logs colette-ci-postgres
          exit 1

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

      # 失敗時の原因調査に使う。
      - name: Show database logs on failure
        if: failure()
        run: docker logs colette-ci-postgres || true

      # テストが失敗した場合も、CI専用コンテナを片付ける。
      - name: Clean up test database
        if: always()
        run: docker rm -f -v colette-ci-postgres || true

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 開発コンテナと同じnpmで、依存インストールと各チェックを実行する。
      - name: Set up npm
        run: npm install --global npm@12.2.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Lint frontend code
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install formatting dependencies
        run: npm ci

      - name: Audit formatting dependencies
        run: npm audit --audit-level=moderate

      - name: Check code formatting
        run: npm run format:check
