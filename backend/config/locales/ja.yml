ja:
  errors:
    format: "%{attribute}%{message}"

  activerecord:
    models:
      customer: "顧客情報"
      restaurant_master: "席情報"
      reservation: "予約情報"

    attributes:
      customer:
        customer_kind: "顧客区分"
        name: "顧客名"
        kana: "フリガナ"
        postal_code: "郵便番号"
        address: "住所"
        phone_number: "電話番号"
        email: "メールアドレス"
        birthday: "生年月日"
        company_name: "法人名"
        company_name_kana: "法人名カナ"
        company_postal_code: "法人郵便番号"
        company_address: "法人住所"
        company_phone_number: "法人電話番号"
        company_email: "法人メールアドレス"
        memo: "メモ"

      reservation:
        customer_id: "選択した顧客"
        reservation_name: "予約者名"
        reservation_phone_number: "電話番号"
        starts_at: "予約開始日時"
        ends_at: "予約終了日時"
        guest_count: "人数"
        requested_restaurant_master_type: "希望席種"
        reservation_status: "予約状況"
        reservation_route: "予約経路"
        menu_type: "メニュー"
        occasion: "利用目的"
        restaurant_master_ids: "確定テーブル"

    errors:
      messages:
        blank: "を入力してください"
        too_long: "は%{count}文字以内で入力してください"
        inclusion: "は正しい値を選択してください"
        required: "を入力してください"
        invalid_category: "は正しい種類の選択肢を選んでください"
        insufficient_capacity: "では予約人数分の定員を確保できません"
      models:
        reservation:
          attributes:
            customer_id:
              overlapping_reservation: "には、同じ時間帯の予約がすでに登録されています。既存の予約を編集してください。"

            reservation_name:
              blank: "を入力してください"
              too_long: "は%{count}文字以内で入力してください"

            reservation_phone_number:
              blank: "を入力してください"
              too_long: "は%{count}文字以内で入力してください"

            starts_at:
              blank: "を入力してください"
              outside_business_hours: "は17:00から21:00の間で指定してください"

            ends_at:
              blank: "を入力してください"
              must_be_after_starts_at: "は予約開始日時より後に指定してください"
              outside_business_hours: "は17:00から21:00の間で指定してください"

            guest_count:
              blank: "を入力してください"
              not_an_integer: "は整数で入力してください"
              greater_than: "%{count}より大きい値を入力してください"

            requested_restaurant_master_type:
              required: "を選択してください"
            reservation_status:
              required: "を選択してください"
